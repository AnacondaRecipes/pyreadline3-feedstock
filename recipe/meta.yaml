{% set name = "pyreadline3" %}
{% set version = "3.5.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyreadline3-{{ version }}.tar.gz
  sha256: 8d57d53039a1c75adba8e50dd3d992b28143480816187ea5efbd5c78e6c885b7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [not win]
  skip: true  # [py<35]

requirements:
  host:
    - pip
    - python
    - sphinx
    - setuptools
    - setuptools-scm
    - setuptools-git-versioning
  run:
    - python

test:
  imports:
    - pyreadline3
    - pyreadline3.clipboard
    - pyreadline3.configuration
    - pyreadline3.console
    - pyreadline3.keysyms
    - pyreadline3.lineeditor
    - pyreadline3.modes
    - pyreadline3.test
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/pypi/pyreadline3/
  summary: A python implementation of GNU readline.
  license: BSD-3-Clause
  license_family: BSD
  license_file: doc/COPYING
  dev_url: https://github.com/pyreadline3/pyreadline3

extra:
  recipe-maintainers:
    - tschoonj
